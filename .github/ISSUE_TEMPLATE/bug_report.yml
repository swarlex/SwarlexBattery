name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A wrong or missing battery level? Use the **Device report** form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Right-click the tray icon
        2. ...
  - type: input
    id: version
    attributes:
      label: SwarlexBattery version
      description: Right-click the tray icon; the version is shown in the update row.
      placeholder: v1.5.2
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Right-click the tray icon > Diagnostics… and drag the file here (no personal data in it).
