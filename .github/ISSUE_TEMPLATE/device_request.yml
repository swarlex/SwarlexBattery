name: Device report
description: Your mouse, keyboard or headset is not shown, or shows a wrong level
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        Before you start: update SwarlexBattery, close the maker's software (Synapse, G HUB, …) and wake
        the device. Then right-click the tray icon > **Diagnostics…**. More help:
        [CONTRIBUTING](https://github.com/swarlex/SwarlexBattery/blob/main/.github/CONTRIBUTING.md).
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: Logitech G Pro X Superlight 2
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How is it connected?
      options: [2.4 GHz receiver / dongle, USB cable, Bluetooth, Several of these]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: diagnostics.txt
      description: |
        Drag `diagnostics.txt` here (it is in `%APPDATA%\SwarlexBattery`). Attach the whole file.
        It contains no personal data: MAC addresses and serial numbers are masked.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you see?
      description: Not shown, a wrong level or a stuck level? Which level does the maker's own app show?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Known protocol source (optional)
      description: An open-source project or the maker's web driver that reads this device's battery.
      placeholder: https://github.com/...
